name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Forbidden content check
        run: |
          python3 - <<'PY'
          import subprocess, sys
          authored_metal = {
              "skyhost/tests/fixtures/shaders/adjust_vertex_color.metal",
              "skyhost/tests/fixtures/shaders/copy_texture.metal",
              "skyhost/tests/fixtures/shaders/position_uv.metal",
              "skyhost/tests/fixtures/shaders/sample_texture.metal",
              "skyhost/tests/fixtures/shaders/uniform_color.metal",
              "skyhost/tests/fixtures/shaders/vertex_color_transform.metal",
              "skyhost/tests/fixtures/shaders/vertex_id_quad.metal",
          }
          forbidden_suffixes = (
              ".xci", ".nsp", ".nca", ".nsz", ".xcz", ".keys",
              ".patched.bin", ".bsa", ".esm", ".esp", ".ess",
          )
          forbidden_names = {"prod.keys", "title.keys", "AGENTS.local.md"}
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = []
          for path in tracked:
              lower = path.lower()
              name = path.rsplit("/", 1)[-1]
              if name in forbidden_names or lower.endswith(forbidden_suffixes):
                  bad.append(path)
              elif lower.endswith(".metal") and path not in authored_metal:
                  bad.append(path)
              elif path.startswith(("skyrim-work/", "docs/screenshots/")):
                  bad.append(path)
          if bad:
              print("Forbidden tracked files detected:", *bad, sep="\n  ", file=sys.stderr)
              sys.exit(1)
          print(f"Verified {len(tracked)} tracked files contain no game or private artifacts.")
          PY

      - name: Install pinned local tools
        run: ./setup-skyrim.sh --tools-only --ios

      - name: Run Python setup and host CI suites
        run: |
          eval "$(python3 - <<'PY'
          from pathlib import Path
          import shlex, sys
          sys.path.insert(0, "tools")
          from sky_tools import tool_environment
          for k, v in tool_environment(Path("skyrim-work")).items():
              if k in {"PATH", "SKY_PYTHON", "DOTNET_ROOT", "DOTNET_CLI_HOME", "NUGET_PACKAGES",
                       "NUGET_HTTP_CACHE_PATH", "RestorePackagesPath", "RestoreSources",
                       "RestoreAdditionalProjectSources", "RestoreFallbackFolders",
                       "RestoreAdditionalProjectFallbackFolders", "NUGET_FALLBACK_PACKAGES",
                       "RestoreConfigFile", "HACTOOL", "DOTNET_MULTILEVEL_LOOKUP",
                       "DOTNET_CLI_TELEMETRY_OPTOUT", "DOTNET_SKIP_FIRST_TIME_EXPERIENCE", "DOTNET_NOLOGO"}:
                  print(f"export {k}={shlex.quote(v)}")
          PY
          )"
          "$SKY_PYTHON" -m unittest discover -s tools/tests -v
          make -C skyhost test-ci
